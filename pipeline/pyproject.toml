[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "interview-pipeline"
version = "0.1.0"
description = "VM-side pipeline for interview notes (state management, transfer verification, save/delete guards)"
requires-python = ">=3.12"
dependencies = []

# STT 実エンジン（faster-whisper）は任意依存。未導入の環境では
# エンジン未設定として扱われ、パッケージ本体は依存なしで使える。
[project.optional-dependencies]
stt = ["faster-whisper>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
